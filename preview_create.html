<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Biodata Mahasiswa - Sistem Biodata Mahasiswa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 12px; border: none; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        .form-label { font-weight: 600; color: #334155; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="preview_read.html">
            <i class="bi bi-mortarboard-fill me-2 fs-4"></i> SIAKAD • Biodata Mahasiswa
        </a>
        <div class="navbar-nav ms-auto">
            <span class="nav-item nav-link text-white-50">Tugas 2: CRUD Read & Create</span>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">

            <div class="card p-4">
                <div class="d-flex align-items-center mb-4 pb-2 border-bottom">
                    <a href="preview_read.html" class="btn btn-outline-secondary btn-sm me-3">
                        <i class="bi bi-arrow-left"></i> Kembali
                    </a>
                    <div>
                        <h4 class="mb-0 text-dark fw-bold">Tambah Biodata Mahasiswa Baru</h4>
                        <p class="text-muted mb-0 small">Formulir input data baru ke database (Tahap Create).</p>
                    </div>
                </div>

                <form action="preview_read.html" method="get">
                    <div class="mb-3">
                        <label for="nim" class="form-label">Nomor Induk Mahasiswa (NIM) <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nim" name="nim" value="202401004" required>
                    </div>

                    <div class="mb-3">
                        <label for="nama" class="form-label">Nama Lengkap <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nama" name="nama" value="Baiq Dian Lestari" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label d-block">Jenis Kelamin <span class="text-danger">*</span></label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="jenis_kelamin" id="jk_l" value="Laki-laki">
                            <label class="form-check-label" for="jk_l">Laki-laki</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="jenis_kelamin" id="jk_p" value="Perempuan" checked required>
                            <label class="form-check-label" for="jk_p">Perempuan</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="prodi" class="form-label">Program Studi <span class="text-danger">*</span></label>
                        <select class="form-select" id="prodi" name="prodi" required>
                            <option value="Teknik Informatika" selected>Teknik Informatika</option>
                            <option value="Sistem Informasi">Sistem Informasi</option>
                            <option value="Teknologi Informasi">Teknologi Informasi</option>
                            <option value="Rekayasa Perangkat Lunak">Rekayasa Perangkat Lunak</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="alamat" class="form-label">Alamat Lengkap</label>
                        <textarea class="form-control" id="alamat" name="alamat" rows="3">Jl. Majapahit No. 45, Ampenan, Mataram</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                        <a href="preview_read.html" class="btn btn-light px-4">Batal</a>
                        <button type="submit" class="btn btn-primary px-4 d-inline-flex align-items-center">
                            <i class="bi bi-save2-fill me-2"></i> Simpan Biodata
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
